[project]
name = "mob_map"
version = "0.1.0"
description = "Mobile Mapping: Dense 3D Reconstruction from Stereo Image Sequences using Structure from Motion"
readme = "README.md"
authors = [{ name = "Jan Duchscherer", email = "duchsche@hm.edu" }]
requires-python = ">=3.12"
dependencies = [
    "open3d>=0.19.0",
    "pytransform3d>=3.14.3",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "pandas>=2.3.3",
    "plotly>=6.5.0",
    "streamlit>=1.51.0",
    "ipympl>=0.9.8",             # %matplotlib widget
    "jupyter>=1.1.1",
    "ipykernel>=7.1.0",
    "notebook>=7.5.0",
    "jupyterlab>=4.5.0",
    "opencv-python>=4.12.0.88",
    "numpy>=2.0,<2.3",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "pillow>=12.0.0",
    "pytest>=9.0.1",
    "rich>=14.2.0",
    "tomlkit>=0.13.3",
    "devtools>=0.12.2",
    "watchdog>=6.0.0",
]

    [project.optional-dependencies]
    dev = ["pytest>=8.4.2", "pytest-cov>=7.0.0", "ruff>=0.1.0", "mypy>=1.0.0"]

    [project.scripts]
    mob-map-st = "mob_map.ui.app:streamlit_entry"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mob_map"]

[tool.uv]
    [tool.uv.sources]
    mob_map = { path = ".", editable = true }

[tool.ruff]
target-version = "py311"
line-length    = 120
indent-width   = 4

    [tool.ruff.lint]
    select = [
        "E",  # pycodestyle errors
        "W",  # pycodestyle warnings
        "F",  # Pyflakes
        "I",  # isort
        "B",  # flake8-bugbear
        "C4", # flake8-comprehensions
        "UP", # pyupgrade (Python 3.11+ features)
        "N",  # pep8-naming
    ]
    ignore = [
        "E501",  # line too long (handled by formatter)
        "UP037",
        "F722",
    ]

    [tool.ruff.format]
    quote-style               = "double"
    indent-style              = "space"
    skip-magic-trailing-comma = false
    line-ending               = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["oracle_rri"]
branch = true
